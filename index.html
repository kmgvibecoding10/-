<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос о профессиональном выгорании</title>
<meta name="description" content="Анонимный опросник для самооценки профессионального выгорания сотрудников: CBI, BAT-12, WHO-5.">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1d2430;--muted:#5b6575;--line:#e0e4ea;--accent:#2f6fed;--accent-t:#fff;
  --g:#2e9e5b;--gbg:#e6f5ec;--y:#c98a00;--ybg:#fff4d6;--o:#d9610f;--obg:#ffe9db;--r:#c62828;--rbg:#fde4e4;
  --shadow:0 1px 3px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161c;--card:#1b212a;--text:#e8ecf2;--muted:#9aa5b5;--line:#2c3541;--accent:#6b9bff;--accent-t:#0d1320;
  --g:#5ccb8a;--gbg:#17301f;--y:#f0b73a;--ybg:#3a2f12;--o:#ff9a55;--obg:#3b2415;--r:#ff7b7b;--rbg:#3a1a1a;--shadow:none;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent)}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;color:var(--text)}
nav a{margin-left:14px;text-decoration:none;color:var(--muted);font-size:15px;padding:8px 0;display:inline-block}
nav a:hover,nav a.on{color:var(--accent)}
main{padding:24px 0 48px;min-height:70vh}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .5em}
h2{font-size:1.4rem;margin:1.4em 0 .5em}
h3{font-size:1.1rem;margin:1.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.btn{display:inline-block;border:0;border-radius:10px;padding:14px 22px;min-height:48px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-t);text-decoration:none}
.btn.sec{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.notice{border-left:5px solid var(--accent);background:var(--card);padding:14px 16px;border-radius:8px;margin:16px 0}
.anon{background:var(--gbg);border:1px solid var(--g);border-radius:14px;padding:18px 20px;margin:20px 0;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.draft{background:var(--ybg);border:1px dashed var(--y);border-radius:8px;padding:10px 14px;font-size:.9rem;margin:12px 0}
/* survey */
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 18px}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;background:var(--card)}
.q.err{border-color:var(--r);background:var(--rbg)}
.q .t{font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.q .num{color:var(--muted);font-weight:400;min-width:2.2em}
.hint-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:50%;width:26px;height:26px;cursor:pointer;flex:none;font-weight:700}
.hint{font-size:.9rem;color:var(--muted);margin:-4px 0 10px 2.2em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 150px;position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:11px 8px;min-height:46px;font-size:.95rem;cursor:pointer}
.opt input:checked+span{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.err-msg{color:var(--r);font-size:.9rem;display:none;margin-top:6px}
.q.err .err-msg{display:block}
label.fld{display:block;margin:14px 0 4px;font-weight:600}
select,textarea,input[type=text]{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
textarea{min-height:100px;resize:vertical}
.chk{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.chk input{width:24px;height:24px;margin-top:3px;flex:none}
/* results */
.zone{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem}
.z-g{background:var(--gbg);color:var(--g)}.z-y{background:var(--ybg);color:var(--y)}.z-o{background:var(--obg);color:var(--o)}.z-r{background:var(--rbg);color:var(--r)}
.bar{position:relative;height:16px;border-radius:8px;margin:14px 0 6px;background:linear-gradient(90deg,var(--g) 0 49.5%,var(--y) 49.5% 74.5%,var(--o) 74.5% 99.5%,var(--r) 99.5%);opacity:.85}
.bar.b3{background:linear-gradient(90deg,var(--g) 0 33.3%,var(--y) 33.3% 66.6%,var(--r) 66.6%)}
.bar .mk{position:absolute;top:-6px;width:6px;height:28px;border-radius:3px;background:var(--text);transform:translateX(-50%);border:2px solid var(--card)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.pill-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr auto;gap:10px;align-items:center;margin:10px 0}
@media(max-width:560px){.pill-row{grid-template-columns:1fr}}
.recs li{margin:6px 0}
.help-box{background:var(--obg);border:1px solid var(--o);border-radius:14px;padding:18px 20px;margin:16px 0}
.code{font:700 1.6rem/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px 18px;display:inline-block}
details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;background:var(--card)}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}
footer{border-top:1px solid var(--line);background:var(--card);padding:18px 0;font-size:.92rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sr{position:absolute;left:-9999px}
/* ---- краски и визуализация ---- */
:root{--p:#7c4dff;--t:#12a5a0;--pk:#e8508a;--h1:#2f6fed;--h2:#7c4dff;--tint1:#eaf1ff;--tint2:#f1ebff;--tint3:#e1f6f4;--tint4:#ffeaf2}
@media (prefers-color-scheme:dark){:root{--p:#a68bff;--t:#4fd1c5;--pk:#ff7eb0;--tint1:#17233d;--tint2:#241d3d;--tint3:#12302e;--tint4:#3a1a28}}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:34px 28px;margin:0 0 20px;color:#fff;background:linear-gradient(135deg,#2f6fed 0%,#7c4dff 55%,#e8508a 100%)}
.hero h1{margin:0 0 .4em;font-size:2.1rem}
.hero p{max-width:520px;margin:0 0 1em;opacity:.95}
.hero .btn{background:#fff;color:#4a35c9}
.hero .btn.sec{background:transparent;color:#fff;border-color:#fff}
.hero svg.art{position:absolute;right:-30px;bottom:-30px;width:300px;opacity:.28;pointer-events:none}
.feat{border-radius:16px;padding:18px;border:1px solid var(--line)}
.feat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:10px;color:#fff}
.f1{background:var(--tint1)}.f1 .ic{background:linear-gradient(135deg,#2f6fed,#6b9bff)}
.f2{background:var(--tint2)}.f2 .ic{background:linear-gradient(135deg,#7c4dff,#b39bff)}
.f3{background:var(--tint3)}.f3 .ic{background:linear-gradient(135deg,#12a5a0,#4fd1c5)}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.steps .st{flex:1 1 150px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.steps .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.stepper{display:flex;gap:6px;margin:6px 0 16px}
.stepper i{flex:1;height:8px;border-radius:6px;background:var(--line)}
.stepper i.on{background:var(--ac,var(--accent))}
.stepper i.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac,var(--accent)) 30%,transparent)}
.phead{border-radius:16px;padding:18px 20px;margin:8px 0 16px;color:#fff;background:var(--grad)}
.phead h1{margin:0;font-size:1.5rem}.phead p{margin:.4em 0 0;opacity:.95}
.opt:hover span{border-color:var(--ac,var(--accent))}
.opt input:checked+span{background:var(--ac,var(--accent))}
.q{border-left:5px solid var(--ac,var(--accent))}
.sum{border-radius:18px;padding:22px;margin:16px 0;display:flex;gap:22px;align-items:center;flex-wrap:wrap;border:1px solid var(--line)}
.sum.zg{background:var(--gbg)}.sum.zy{background:var(--ybg)}.sum.zr{background:var(--rbg)}
.sum h2{margin:0 0 .3em}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:14px 0}
.ringbox{text-align:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.ringbox .lb{font-size:.85rem;color:var(--muted);margin-top:4px}
.ring text{font-family:inherit}
.card.c1{border-top:5px solid #2f6fed}.card.c2{border-top:5px solid #7c4dff}.card.c3{border-top:5px solid #12a5a0}.card.c4{border-top:5px solid #e8508a}
.radar{display:block;margin:6px auto;max-width:340px;width:100%}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.bar{height:18px;border-radius:9px;opacity:1}
@media print{header.top,footer,.no-print,.hint-btn{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">Опрос о выгорании</a>
    <nav aria-label="Основное меню">

      <a href="#/hr" data-r="hr">HR</a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer>
  <div class="wrap">
    <span>Результат — самооценка, а не диагноз.</span>
    <span>Нужна помощь? Экстренный номер <strong>112</strong> · <a href="#/help">Где получить помощь</a></span>
  </div>
</footer>

<script>
"use strict";
/* ============ НАСТРОЙКИ (в продукте — админ-панель, п. AD-3) ============ */
const CONFIG = {
  showComparison: true, // пилот: блок сравнения методик (AD-4)
  // Пороговые значения BAT-12 (общеевропейские, проверить по руководству BAT 2020). Для России норм нет.
  bat: {
    total: {risk: 2.59, high: 3.02},
    EX: {risk: 2.59, high: 3.02},
    MD: {risk: 2.59, high: 3.02},
    CI: {risk: 2.59, high: 3.02},
    EI: {risk: 2.59, high: 3.02}
  },
  minGroup: 5
};

/* ============ ВОПРОСЫ ============ */
const FREQ = [["Всегда",100],["Часто",75],["Иногда",50],["Редко",25],["Никогда / почти никогда",0]];
const DEG  = [["В очень высокой степени",100],["В высокой степени",75],["В некоторой степени",50],["В низкой степени",25],["В очень низкой степени",0]];
const DEGR = [["В очень высокой степени",0],["В высокой степени",25],["В некоторой степени",50],["В низкой степени",75],["В очень низкой степени",100]];
const BATS = [["Никогда",1],["Редко",2],["Иногда",3],["Часто",4],["Всегда",5]];
const WHOS = [["Всё время",5],["Большую часть времени",4],["Больше половины времени",3],["Меньше половины времени",2],["Иногда",1],["Ни разу",0]];

const PARTS = [
 {id:"P", title:"Часть 1. Ваше общее самочувствие", intro:"Вспомните, как вы себя чувствовали в последнее время. Отвечайте, как есть, правильных и неправильных ответов нет.", items:[
  ["P1","Как часто вы чувствуете усталость?",FREQ,"Любая усталость — и физическая, и моральная"],
  ["P2","Как часто вы чувствуете физическое истощение?",FREQ,"Когда тело «без сил», даже если вы ничего тяжёлого не делали"],
  ["P3","Как часто вы чувствуете эмоциональное истощение?",FREQ,"Когда нет сил на эмоции, всё раздражает или безразлично"],
  ["P4","Как часто вы думаете: «Я больше не могу»?",FREQ,"Ощущение, что ресурс закончился"],
  ["P5","Как часто вы чувствуете себя изнурённым?",FREQ,"Состояние «выжатого лимона»"],
  ["P6","Как часто вы чувствуете слабость и уязвимость к болезням?",FREQ,"Частые простуды, ощущение, что организм «сдаёт»"]]},
 {id:"W", title:"Часть 2. Вы и ваша работа", intro:"Теперь подумайте о работе: как она влияет на ваши силы и настроение.", items:[
  ["W1","Изматывает ли вас работа эмоционально?",DEG,"Насколько работа забирает эмоциональные силы"],
  ["W2","Чувствуете ли вы, что выгораете из-за работы?",DEG,"Ваше собственное ощущение, без оценки «правильности»"],
  ["W3","Вызывает ли работа у вас раздражение и чувство безысходности?",DEG,"Ощущение, что усилия не приносят результата"],
  ["W4","Как часто вы чувствуете себя измотанным в конце рабочего дня?",FREQ],
  ["W5","Как часто утром вы чувствуете усталость при мысли о предстоящем рабочем дне?",FREQ],
  ["W6","Как часто вы чувствуете, что каждый рабочий час даётся вам с трудом?",FREQ],
  ["W7","Хватает ли у вас сил на семью и друзей в свободное время?",DEGR,"Обратная шкала, пересчитывается автоматически"]]},
 {id:"B", title:"Часть 3. Как вы чувствуете себя на работе в последнее время", intro:"Оцените, как часто вы замечаете у себя следующее на работе.",
  draft:"РАБОЧИЙ ПЕРЕВОД. Тексты BAT-12 нужно заменить дословным текстом официальной русской версии (burnoutassessmenttool.be) после получения от авторов.", items:[
  ["B1","На работе я чувствую себя психически истощённым(ой)",BATS],
  ["B2","Всё, что я делаю на работе, требует от меня больших усилий",BATS],
  ["B3","После рабочего дня мне трудно восстановить силы",BATS],
  ["B4","Мне трудно найти в себе энтузиазм к работе",BATS],
  ["B5","На работе я испытываю сильное отвращение к своей работе",BATS],
  ["B6","Мне безразлична моя работа",BATS],
  ["B7","На работе мне трудно сохранять концентрацию",BATS],
  ["B8","На работе мне трудно ясно мыслить",BATS],
  ["B9","Я допускаю ошибки в работе, потому что мои мысли заняты другим",BATS],
  ["B10","На работе я не могу контролировать свои эмоции",BATS],
  ["B11","Я не узнаю себя в том, как эмоционально реагирую на работе",BATS],
  ["B12","Я могу непреднамеренно слишком остро отреагировать",BATS]]},
 {id:"H", title:"Часть 4. Ваше настроение за последние 2 недели", intro:"Выберите вариант, который лучше всего описывает ваше самочувствие за последние 2 недели.",
  draft:"РАБОЧИЙ ПЕРЕВОД. Нужно использовать официальный русский текст WHO-5 без изменений.", items:[
  ["H1","Я чувствовал(а) себя бодрым(ой) и в хорошем настроении",WHOS],
  ["H2","Я чувствовал(а) себя спокойным(ой) и расслабленным(ой)",WHOS],
  ["H3","Я чувствовал(а) себя активным(ой) и энергичным(ой)",WHOS],
  ["H4","Я просыпался(лась) свежим(ей) и отдохнувшим(ей)",WHOS],
  ["H5","Моя повседневная жизнь была наполнена интересными для меня занятиями",WHOS]]}
];
const OPEN_Q = ["Что сильнее всего забирает ваши силы на работе?","Что могла бы изменить компания, чтобы вам стало легче?"];
const DEMO = [
  ["dept","Отдел / направление",["Отдел 1","Отдел 2","Отдел 3","Отдел 4"],"Список отделов задаётся в админ-панели"],
  ["tenure","Стаж в компании",["До 1 года","1–3 года","3–5 лет","Более 5 лет"]],
  ["format","Формат работы",["Офис","Удалённо","Смешанный"]],
  ["lead","Руководящая должность",["Да","Нет"]]
];

/* ============ ТЕКСТЫ РЕЗУЛЬТАТОВ (черновик — проверяет клинический психолог, п. 5.3) ============ */
const LEVELS = [ // CBI
  {max:49, name:"Низкий", z:"g", zone:1},
  {max:74, name:"Умеренный", z:"y", zone:2},
  {max:99, name:"Высокий", z:"o", zone:3},
  {max:100, name:"Очень высокий", z:"r", zone:3}];
const ZNAME = {1:"Зелёная зона",2:"Жёлтая зона",3:"Красная зона"};
const ZCLS = {1:"g",2:"y",3:"r"};
const CBI_TXT = {
  P:{title:"Личное выгорание (общая усталость)",
    t:["Усталость сейчас в пределах обычного. Это хороший запас, который стоит беречь.",
       "Усталость заметна и накапливается. Пока это ранний этап, на котором восстановление идёт быстрее всего.",
       "Силы на исходе: усталость стала постоянным фоном. Организму нужно восстановление, а не ещё одно усилие.",
       "Ресурс практически исчерпан. Это сигнал, что нужна поддержка, а не повод винить себя."]},
  W:{title:"Выгорание, связанное с работой",
    t:["Работа пока не забирает больше сил, чем отдаёт. Важно сохранить границы между работой и отдыхом.",
       "Работа заметно утомляет. Стоит присмотреться, что именно в ней забирает больше всего сил.",
       "Работа сильно истощает вас. Без изменений нагрузки или условий восстановиться будет трудно.",
       "Связь усталости с работой очень сильная. Желательно обсудить нагрузку и обратиться за поддержкой."]}
};
const BAT_TXT = {
  total:{title:"Общий уровень выгорания (BAT-12)",

function mk(area,m){return {
  get(k,d){try{const v=window[area].getItem(k);if(v)return JSON.parse(v)}catch(e){}return k in m?JSON.parse(m[k]):d},
  set(k,v){const j=JSON.stringify(v);m[k]=j;try{window[area].setItem(k,j)}catch(e){}}
}}
const store = mk("sessionStorage",mem.s);

function state(){return store.get("st",{consent:false,demo:{},ans:{},open:{},fb:{},part:0,link:""})}
function save(s){store.set("st",s)}
async function sha(t){
  if(!(window.crypto&&crypto.subtle)){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "x"+h}
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function genCode(){const a="АБВГДЕЖКМНПРСТУФХЦЧШЭЮЯ23456789";const g=()=>Array.from({length:3},()=>a[Math.floor(Math.random()*a.length)]).join("");return g()+"-"+g()+"-"+g()}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const r1=n=>Math.round(n*10)/10;
const normCode=c=>c.toUpperCase().replace(/[^A-ZА-ЯЁ0-9]/g,"");

/* ============ РАСЧЁТЫ ============ */
function cbiLevel(v){return LEVELS.find(l=>v<=l.max)}
function batZone(v,key){const c=CONFIG.bat[key];return v>=c.high?3:v>=c.risk?2:1}
function compute(ans){
  const val=(id,scale)=>scale.find(o=>o[0]===ans[id])[1];
  const sc={};
  const P=PARTS[0].items.map(i=>val(i[0],i[2])), W=PARTS[1].items.map(i=>val(i[0],i[2]));
  sc.P=avg(P); sc.W=avg(W);
  const B=PARTS[2].items.map(i=>val(i[0],i[2]));
  sc.EX=avg(B.slice(0,3)); sc.MD=avg(B.slice(3,6)); sc.CI=avg(B.slice(6,9)); sc.EI=avg(B.slice(9,12)); sc.BAT=avg(B);
  const H=PARTS[3].items.reduce((s,i)=>s+val(i[0],i[2]),0);
  sc.WHO=H*4;
  const lp=cbiLevel(sc.P), lw=cbiLevel(sc.W);
  const cbiZone=Math.max(lp.zone,lw.zone);
  const bz={total:batZone(sc.BAT,"total"),EX:batZone(sc.EX,"EX"),MD:batZone(sc.MD,"MD"),CI:batZone(sc.CI,"CI"),EI:batZone(sc.EI,"EI")};
  const whoLvl=sc.WHO>50?0:sc.WHO>=29?1:2;
  return {sc,lp,lw,cbiZone,bz,batZone:bz.total,overall:Math.max(cbiZone,bz.total),whoLvl,t:Date.now()};
}

    const key=await sha(normCode(code));

    (db[key]=db[key]||[]).push({t:r.t,sc:r.sc,overall:r.overall,whoLvl:r.whoLvl,cbiZone:r.cbiZone,batZone:r.batZone});
    lstore.set("results",db);
    store.set("last",{r,code});
    // очистка ответов сессии
    save({consent:true,demo:{},ans:{},open:{},fb:{},part:0,link:""});
    go("results");
  };
}

function bar(v,max,cls){return `<div class="bar ${cls||""}" role="img" aria-label="Значение ${r1(v)} из ${max}"><i class="mk" style="left:${Math.min(100,Math.max(0,v/max*100))}%"></i></div>`}
const ZCOL={1:"var(--g)",2:"var(--y)",3:"var(--r)"};
function ring(v,max,col,label,sub,size){
  size=size||120;const R=size/2-12,C=2*Math.PI*R,f=Math.min(1,Math.max(0,v/max));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${label}: ${label==="Баллы"?"":""}${sub}">
   <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
   <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size/4.4}" font-weight="700" fill="currentColor">${sub}</text></svg>`;
}
function radar(vals,labels,cols){
  const S=300,c=S/2,R=95,n=vals.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,f)=>[c+Math.cos(ang(i))*R*f,c+Math.sin(ang(i))*R*f];
  const poly=f=>vals.map((_,i)=>pt(i,f).join(",")).join(" ");
  const data=vals.map((v,i)=>pt(i,Math.min(1,Math.max(0,(v-1)/4))).join(",")).join(" ");
  return `<svg class="radar" viewBox="0 0 ${S} ${S}" role="img" aria-label="Профиль выгорания BAT-12">
   ${[.25,.5,.75,1].map(f=>`<polygon points="${poly(f)}" fill="none" stroke="currentColor" opacity=".15"/>`).join("")}
   ${vals.map((_,i)=>`<line x1="${c}" y1="${c}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="currentColor" opacity=".15"/>`).join("")}
   <polygon points="${data}" fill="#7c4dff" fill-opacity=".25" stroke="#7c4dff" stroke-width="2.5"/>
   ${vals.map((v,i)=>{const p=pt(i,Math.min(1,Math.max(0,(v-1)/4)));return `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${cols[i]}" stroke="var(--card)" stroke-width="2"/>`}).join("")}
   ${labels.map((l,i)=>{const p=pt(i,1.2),a=p[0]<c-5?"end":p[0]>c+5?"start":"middle";return `<text x="${p[0]}" y="${p[1]}" text-anchor="${a}" dominant-baseline="central" font-size="11" fill="currentColor">${l}</text>`}).join("")}
  </svg>`;
}

function my(){

function whoChange(l){const d=l[l.length-1].sc.WHO-l[l.length-2].sc.WHO;return Math.abs(d)>=10?`<p class="notice">Индекс WHO-5 изменился на ${d>0?"+":""}${Math.round(d)} пунктов. Это значимое изменение.</p>`:""}
function chart(list){
  const W=600,H=220,pad=34,series=[["P","Личное (CBI)","#2f6fed",x=>x.sc.P],["W","Работа (CBI)","#d9610f",x=>x.sc.W],["B","BAT-12","#8e44ad",x=>(x.sc.BAT-1)/4*100],["H","WHO-5","#2e9e5b",x=>x.sc.WHO]];
  const n=list.length,X=i=>pad+(n===1?0:i*(W-2*pad)/(n-1)),Y=v=>H-pad-v/100*(H-2*pad);
  return `<h3>Динамика (0–100)</h3><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="График динамики">
   ${[0,50,100].map(v=>`<line x1="${pad}" x2="${W-pad}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".15"/><text x="4" y="${Y(v)+4}" font-size="11" fill="currentColor">${v}</text>`).join("")}
   ${series.map(([,,c,f])=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${list.map((x,i)=>X(i)+","+Y(f(x))).join(" ")}"/>${list.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(f(x))}" r="4" fill="${c}"/>`).join("")}`).join("")}
   ${list.map((x,i)=>`<text x="${X(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="currentColor">${new Date(x.t).toLocaleDateString("ru-RU")}</text>`).join("")}
  </svg><div class="row small">${series.map(([,t,c])=>`<span><b style="color:${c}">●</b> ${t}</span>`).join("")}</div>
  <p class="muted small">BAT-12 пересчитан из шкалы 1–5 в 0–100 для графика.</p>`;
}
